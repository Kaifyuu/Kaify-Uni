<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'General Sans', sans-serif; }
        .card { border-radius: 12px; border: none; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold">Admin Dashboard</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 fw-bold fs-5">Product Inventory Management (UC6)</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Product Name</th>
                                        <th>Category</th>
                                        <th>Current Stock</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="inventoryTable">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 fw-bold fs-5">Processing Orders (UC7)</div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="adminOrderList"></ul>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = 'https://kaify-uni-backend.onrender.com/';
 async function initDashboard() {
            try {
                // 1. Fetch Global Orders from Database
                const ordersRes = await fetch(`${API_URL}api/admin/orders`);
                const orders = await ordersRes.json();
                
                const orderList = document.getElementById('adminOrderList');
                if (orders.length === 0) {
                    orderList.innerHTML = '<li class="list-group-item text-muted text-center py-4">No orders found in database.</li>';
                } else {
                    orderList.innerHTML = ''; // Clear loading state
                    orders.forEach(o => {
                        orderList.innerHTML += `
                            <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                                <div>
                                    <h6 class="mb-0">Order #${o.id} <span class="badge bg-secondary ms-2">User ID: ${o.userId}</span></h6>
                                    <small class="text-muted">${o.date} • ${o.statusText}</small>
                                </div>
                                <span class="badge bg-success fs-6">$${o.total}</span>
                            </li>`;
                    });
                }

                // 2. Fetch Live Inventory from Database
                const productsRes = await fetch(`${API_URL}api/products`);
                const products = await productsRes.json();
                
                const table = document.getElementById('inventoryTable');
                table.innerHTML = ''; // Clear loading state
                products.forEach(p => {
                    table.innerHTML += `
                        <tr>
                            <td>#${p.id}</td>
                            <td class="fw-bold">${p.name}</td>
                            <td><span class="badge bg-secondary">${p.category}</span></td>
                            <td><span class="fw-bold ${p.stock < 5 ? 'text-danger' : 'text-dark'}">${p.stock}</span></td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary" onclick="updateStock('${p.id}', '${p.name}', ${p.stock})">Update Stock</button>
                            </td>
                        </tr>`;
                });
            } catch (error) {
                console.error("Failed to load admin data:", error);
                alert("Cannot connect to backend server.");
            }
        }

        async function updateStock(id, name, currentStock) {
            const newStock = prompt(`Update stock for ${name}:`, currentStock);
            
            // Validate input
            if (newStock !== null && !isNaN(newStock) && newStock.trim() !== '') {
                try {
                    // Send PUT request to Node.js backend
                    const response = await fetch(`${API_URL}api/products/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ stock: parseInt(newStock) })
                    });
                    
                    if (response.ok) {
                        location.reload(); // Refresh the table to see the new DB value
                    } else {
                        alert("Failed to update stock in database.");
                    }
                } catch (error) {
                    console.error("Update failed:", error);
                    alert("Server error during stock update.");
                }
            }
        }

        initDashboard();
    </script>
</body>
</html>
