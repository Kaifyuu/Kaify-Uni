<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'General Sans', sans-serif; }
        .card { border-radius: 12px; border: none; }
        .table-responsive { max-height: 600px; overflow-y: auto; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold">Admin Dashboard</span>
            <div class="d-flex gap-2">
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#productModal" onclick="prepareAddProduct()">+ Add Product</button>
                <a href="index.html" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            
            <!-- Inventory Management -->
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <span class="fw-bold fs-5">Product Inventory Management (UC6)</span>
                        <span class="text-muted small">Sorted by ID (ASC)</span>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light sticky-top">
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Category</th>
                                        <th>Price</th>
                                        <th>Stock</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="inventoryTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order Management -->
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 fw-bold fs-5">Processing Orders (UC7)</div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="adminOrderList"></ul>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Product Modal (Add/Edit) -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="productForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="productModalTitle">Add Product</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editOriginalId">
                        <div class="mb-3">
                            <label class="form-label">Product ID</label>
                            <input type="text" id="prodId" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" id="prodName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" id="prodCategory" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Price</label>
                                <input type="number" step="0.01" id="prodPrice" class="form-control" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Stock</label>
                                <input type="number" id="prodStock" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="prodDesc" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="text" id="prodImage" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Initial Rating (1-5)</label>
                            <input type="number" step="0.1" id="prodRating" class="form-control" value="5.0">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') 
            ? 'http://localhost:3000/' 
            : 'https://kaify-uni-backend.onrender.com/';

        let currentProducts = [];

        async function initDashboard() {
            const token = localStorage.getItem('jwtToken');
            if (!token) {
                alert("Unauthorized access. Please login.");
                window.location.href = 'index.html';
                return;
            }

            try {
                // 1. Fetch Global Orders
                const ordersRes = await fetch(`${API_URL}api/admin/orders`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const orders = await ordersRes.json();
                
                const orderList = document.getElementById('adminOrderList');
                orderList.innerHTML = orders.length ? '' : '<li class="list-group-item text-muted text-center py-4">No orders found.</li>';
                
                orders.forEach(o => {
                    const isCancelled = o.statusStep === -1;
                    const cancelReason = o.cancelComment ? `<div class="mt-1 small text-danger italic">Reason: ${o.cancelComment}</div>` : '';
                    
                    orderList.innerHTML += `
                        <li class="list-group-item py-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="mb-0">Order #${o.id} <span class="badge bg-secondary ms-2">User ID: ${o.userId}</span></h6>
                                    <small class="text-muted">${o.date} • <strong class="${isCancelled ? 'text-danger' : 'text-primary'}">${o.statusText}</strong></small>
                                    ${cancelReason}
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge bg-success fs-6">$${o.total}</span>
                                    <div class="btn-group">
                                        ${!isCancelled && o.statusStep < 3 
                                            ? `<button class="btn btn-sm btn-outline-primary" onclick="advanceOrderStatus(${o.id})">Advance</button>` 
                                            : `<button class="btn btn-sm btn-outline-secondary" disabled>${isCancelled ? 'Cancelled' : 'Delivered'}</button>`}
                                        
                                        ${!isCancelled 
                                            ? `<button class="btn btn-sm btn-outline-warning" onclick="cancelOrder(${o.id})">Cancel</button>` 
                                            : ''}
                                        
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteOrder(${o.id})">Delete</button>
                                    </div>
                                </div>
                            </div>
                        </li>`;
                });

                // 2. Fetch Live Inventory (Sorted by ID)
                const productsRes = await fetch(`${API_URL}api/products?sortById=true`);
                if (!productsRes.ok) throw new Error("Failed to load inventory.");
                currentProducts = await productsRes.json();
                
                const table = document.getElementById('inventoryTable');
                table.innerHTML = '';
                currentProducts.forEach(p => {
                    table.innerHTML += `
                        <tr>
                            <td>#${p.id}</td>
                            <td class="fw-bold">${p.name}</td>
                            <td><span class="badge bg-secondary">${p.category}</span></td>
                            <td>$${parseFloat(p.price).toFixed(2)}</td>
                            <td><span class="fw-bold ${p.stock < 5 ? 'text-danger' : 'text-dark'}">${p.stock}</span></td>
                            <td class="text-end">
                                <div class="btn-group">
                                    <button class="btn btn-sm btn-outline-primary" onclick="prepareEditProduct('${p.id}')">Edit</button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct('${p.id}')">Delete</button>
                                </div>
                            </td>
                        </tr>`;
                });
            } catch (error) {
                console.error("Dashboard Init Error:", error);
                alert("Cannot connect to backend server.");
            }
        }

        // --- PRODUCT CRUD ---

        function prepareAddProduct() {
            document.getElementById('productModalTitle').innerText = "Add New Product";
            document.getElementById('productForm').reset();
            document.getElementById('editOriginalId').value = "";
            document.getElementById('prodId').disabled = false;
        }

        function prepareEditProduct(id) {
            const p = currentProducts.find(x => x.id == id);
            document.getElementById('productModalTitle').innerText = `Edit Product #${id}`;
            document.getElementById('editOriginalId').value = id;
            document.getElementById('prodId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodCategory').value = p.category;
            document.getElementById('prodPrice').value = p.price;
            document.getElementById('prodStock').value = p.stock;
            document.getElementById('prodDesc').value = p.description;
            document.getElementById('prodImage').value = p.imageUrl;
            document.getElementById('prodRating').value = p.rating;
            
            bootstrap.Modal.getOrCreateInstance(document.getElementById('productModal')).show();
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('jwtToken');
            const originalId = document.getElementById('editOriginalId').value;
            const isEdit = originalId !== "";
            
            const payload = {
                id: document.getElementById('prodId').value,
                newId: document.getElementById('prodId').value,
                name: document.getElementById('prodName').value,
                category: document.getElementById('prodCategory').value,
                price: parseFloat(document.getElementById('prodPrice').value),
                stock: parseInt(document.getElementById('prodStock').value),
                description: document.getElementById('prodDesc').value,
                imageUrl: document.getElementById('prodImage').value,
                rating: parseFloat(document.getElementById('prodRating').value)
            };

            try {
                const url = isEdit ? `${API_URL}api/products/${originalId}` : `${API_URL}api/products`;
                const method = isEdit ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
                    initDashboard();
                } else {
                    const errData = await response.json();
                    // THE FIX: Specify why the creation/edit failed (e.g. Duplicate ID)
                    alert(`Action Failed: ${errData.error || "Please check if the Product ID is unique and all fields are valid."}`);
                }
            } catch (error) {
                alert("Server connection failed. Could not save product.");
            }
        });

        async function deleteProduct(id) {
            if (!confirm(`Are you sure you want to delete product #${id}?`)) return;
            const token = localStorage.getItem('jwtToken');
            try {
                const response = await fetch(`${API_URL}api/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) initDashboard();
                else alert("Failed to delete product.");
            } catch (error) { alert("Server error."); }
        }

        // --- ORDER MANAGEMENT ---

        async function advanceOrderStatus(orderId) {
            const token = localStorage.getItem('jwtToken');
            try {
                const response = await fetch(`${API_URL}api/admin/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) initDashboard();
                else alert('Error updating status.');
            } catch (err) { alert('Server error.'); }
        }

        async function cancelOrder(orderId) {
            const comment = prompt("Reason for cancellation:");
            if (comment === null) return;
            
            const token = localStorage.getItem('jwtToken');
            try {
                const response = await fetch(`${API_URL}api/admin/orders/${orderId}/cancel`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ comment })
                });
                if (response.ok) initDashboard();
                else {
                    const err = await response.json();
                    alert(`Error: ${err.error}`);
                }
            } catch (err) { alert('Server error.'); }
        }

        async function deleteOrder(orderId) {
            if (!confirm(`Permanently delete Order #${orderId} and return stock?`)) return;
            const token = localStorage.getItem('jwtToken');
            try {
                const response = await fetch(`${API_URL}api/admin/orders/${orderId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) initDashboard();
                else alert("Failed to delete order.");
            } catch (error) { alert("Server error."); }
        }

        initDashboard();
    </script>
</body>
</html>
