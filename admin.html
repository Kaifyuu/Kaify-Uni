<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">Admin Dashboard</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            
            <div class="col-md-6">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold">Recent Orders (UC7)</div>
                    <ul class="list-group list-group-flush" id="adminOrderList">
                        </ul>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white fw-bold">Quick Actions</div>
                    <div class="card-body">
                        <button class="btn btn-primary w-100 mb-2">Manage Product Inventory (UC6)</button>
                        <button class="btn btn-secondary w-100">Manage Users & Roles (UC8)</button>
                        <hr>
                        <p class="text-muted small mb-0">Note: Inventory and User management require a backend database to persist changes permanently.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Fetch the live orders from localStorage
        const orders = JSON.parse(localStorage.getItem('protoOrders')) || [];
        const orderList = document.getElementById('adminOrderList');

        if (orders.length === 0) {
            orderList.innerHTML = '<li class="list-group-item text-muted text-center py-4">No recent orders.</li>';
        } else {
            // Reverse so newest orders appear at the top
            orders.reverse().forEach((order, index) => {
                orderList.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="my-0">Order #${1000 + index}</h6>
                            <small class="text-muted">${order.date} • ${order.itemsCount} items</small>
                        </div>
                        <span class="badge bg-success rounded-pill">$${order.total}</span>
                    </li>
                `;
            });
        }
    </script>
</body>
</html>
