<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'General Sans', sans-serif; }
        .card { border-radius: 12px; border: none; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid px-4">
            <span class="navbar-brand fw-bold">Admin Dashboard</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row g-4">
            
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 fw-bold fs-5">Product Inventory Management (UC6)</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Product Name</th>
                                        <th>Category</th>
                                        <th>Current Stock</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="inventoryTable">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 fw-bold fs-5">Processing Orders (UC7)</div>
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="adminOrderList"></ul>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const overrides = JSON.parse(localStorage.getItem('adminProductOverrides')) || {};
        const orders = JSON.parse(localStorage.getItem('protoOrders')) || [];

        async function initDashboard() {
            // Load Orders
            const orderList = document.getElementById('adminOrderList');
            if (orders.length === 0) {
                orderList.innerHTML = '<li class="list-group-item text-muted text-center py-4">No recent orders.</li>';
            } else {
                [...orders].reverse().forEach((o, i) => {
                    orderList.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <div><h6 class="mb-0">Order #${1000 + i}</h6><small class="text-muted">${o.date} • ${o.statusText}</small></div>
                            <span class="badge bg-success fs-6">$${o.total}</span>
                        </li>`;
                });
            }

            // Load Inventory (UC6)
            try {
                const response = await fetch('data/json/products.json');
                const products = await response.json();
                const table = document.getElementById('inventoryTable');

                products.forEach(p => {
                    const currentStock = overrides[p.id] ? overrides[p.id].stock : p.stock;
                    table.innerHTML += `
                        <tr>
                            <td>#${p.id}</td>
                            <td class="fw-bold">${p.name}</td>
                            <td><span class="badge bg-secondary">${p.category}</span></td>
                            <td><span class="fw-bold ${currentStock < 5 ? 'text-danger' : 'text-dark'}">${currentStock}</span></td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary" onclick="updateStock('${p.id}', '${p.name}', ${currentStock})">Update Stock</button>
                            </td>
                        </tr>`;
                });
            } catch (e) { console.error("Inventory error:", e); }
        }

        function updateStock(id, name, current) {
            const newStock = prompt(`Update stock for ${name}:`, current);
            if (newStock !== null && !isNaN(newStock)) {
                overrides[id] = { stock: parseInt(newStock) };
                localStorage.setItem('adminProductOverrides', JSON.stringify(overrides));
                location.reload(); // Refresh to show new numbers
            }
        }

        initDashboard();
    </script>
</body>
</html>
