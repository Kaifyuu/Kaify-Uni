<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive E-Commerce Prototype</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'General Sans', sans-serif; 
            scroll-behavior: smooth; 
            background: linear-gradient(-45deg, #a18cd1, #fbc2eb, #8fd3f4, #a1c4fd);
            background-size: 400% 400%;
            animation: ambientFlow 15s ease infinite;
            min-height: 100vh;
        }
        @keyframes ambientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .navbar, .card, .modal-content, .offcanvas, .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.7) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        .hero-section { padding: 80px 0; color: #1a1a1a; }
        .hero-section .text-muted { color: #4a4a4a !important; font-weight: 500; }
        .card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.15); }
        .form-control:focus, .form-select:focus {
            background: rgba(255, 255, 255, 0.9) !important;
            box-shadow: 0 0 0 0.25rem rgba(255, 255, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.8);
        }
        .modal-open { scroll-behavior: auto !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top" data-bs-theme="light">
        <div class="container">
            <a class="navbar-brand text-dark fw-bold" href="#">StoreBrand</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-dark" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-dark" href="#products">Products</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <button id="authBtn" class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#authModal">Login / Register</button>                    
                    <button class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
                        Cart <span id="cartCount" class="badge bg-light text-dark ms-1">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <header id="home" class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 text-dark">Welcome to Our Store</h1>
            <p class="lead text-muted">Interactive prototype with functional cart and order tracking.</p>
        </div>
    </header>
    
    <section id="products" class="py-5">
        <div class="container">
            <h2 class="text-center text-dark mb-5">Our Products</h2>
            <div class="row mb-4">
                <div class="col-md-8 mb-2">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                </div>
                <div class="col-md-2 mb-2">
                    <select id="categorySelect" class="form-select">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="col-md-2 mb-2">
                    <select id="sortSelect" class="form-select">
                        <option value="default">Default Sort</option>
                        <option value="price-asc">Price: Low to High</option>
                        <option value="price-desc">Price: High to Low</option>
                        <option value="name-asc">Name: A to Z</option>
                        <option value="name-desc">Name: Z to A</option>
                    </select>
                </div>
            </div>
            <div class="row g-4" id="productGrid"></div>
        </div>
    </section>

    <div class="modal fade" id="authModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Login / Register</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="authForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" id="authUsername" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="authPassword" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Continue</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="productDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-bottom-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-0 pb-4 px-4" id="productDetailsBody"></div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="profileOffcanvas">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title">My Profile</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <h6 class="mb-3">Order History</h6>
            <div id="orderHistoryList" class="flex-grow-1 overflow-auto pe-2"></div>
            <div class="mt-auto pt-3 border-top">
                <button class="btn btn-outline-danger w-100" id="logoutBtn">Logout</button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="checkoutModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Secure Checkout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="checkoutForm">
                        <div class="mb-3">
                            <label class="form-label">Shipping Address</label>
                            <textarea class="form-control" rows="2" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Credit Card Number</label>
                            <input type="text" class="form-control" pattern="\d{16}" title="Must be 16 digits" placeholder="16 Digits Required" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Expiry</label>
                                <input type="text" class="form-control" placeholder="MM/YY" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">CVV</label>
                                <input type="text" class="form-control" pattern="\d{3,4}" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Shipping Method</label>
                            <select id="shippingSelect" class="form-select" required>
                                <option value="5.00">Standard Shipping - $5.00</option>
                                <option value="15.00">Express Shipping - $15.00</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Pay Now</button>
                    </form>
                    <div id="checkoutSuccess" class="alert alert-success mt-3 d-none text-center">
                        <strong>Payment Successful!</strong><br>Check your Profile for order status.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title">Your Cart</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <ul id="cartItemsList" class="list-group mb-3 flex-grow-1 overflow-auto"></ul>
            <div class="mt-auto border-top pt-3">
                <div class="d-flex justify-content-between mb-3">
                    <strong>Total:</strong><strong id="cartTotal">$0.00</strong>
                </div>
                <button class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#checkoutModal" data-bs-dismiss="offcanvas">Checkout</button>
                <button class="btn btn-link text-danger w-100 mt-2" id="clearCartBtn">Clear Cart</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'https://kaify-uni-backend.onrender.com/';
        let allProducts = [];
        let cart = JSON.parse(localStorage.getItem('protoCart')) || [];
async function requestProducts() {
            try {
                // Fetch directly from the Node.js API (MySQL)
                const response = await fetch(`${API_URL}api/products`);
                allProducts = await response.json(); 
                
                populateCategories(allProducts);
                renderUI(allProducts); 
                
            } catch (error) {
                console.error("Error fetching catalog:", error);
                document.getElementById('productGrid').innerHTML = '<p class="text-danger text-center w-100 py-5">Failed to connect to backend server.</p>';
            }
        }

        function populateCategories(products) {
            const select = document.getElementById('categorySelect');
            const uniqueCategories = [...new Set(products.map(item => item.category))];
            uniqueCategories.forEach(category => {
                select.innerHTML += `<option value="${category}">${category}</option>`;
            });
        }

        function renderUI(products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><h4>No products match your criteria.</h4></div>';
                return;
            }
            products.forEach(product => {
                const stockBadge = product.stock < 5 
                    ? `<span class="badge bg-danger mb-3 align-self-start">Only ${product.stock} left!</span>` 
                    : '';
                grid.innerHTML += `
                    <div class="col-md-4 col-sm-6">
                        <div class="card h-100 shadow-sm border-0">
                            <img src="${product.imageUrl}" class="card-img-top border-bottom" alt="${product.name}" style="height: 200px; object-fit: cover;">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title text-dark mb-1">${product.name}</h5>
                                <div class="text-warning mb-2">&#9733; <span class="text-muted small">${product.rating}</span></div>
                                <h6 class="text-dark mb-2">$${product.price.toFixed(2)}</h6>
                                ${stockBadge}
                                <div class="mt-auto d-flex gap-2">
                                    <button class="btn btn-outline-secondary w-50 view-details-btn" data-id="${product.id}">Details</button>
                                    <button class="btn btn-primary w-50 add-to-cart-btn" data-id="${product.id}">Add</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

async function filterProducts() {
    // 1. Grab the current values from your UI inputs
    const search = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categorySelect').value;
    const sort = document.getElementById('sortSelect').value;

    // 2. The Gatekeeper Check: Build the URL dynamically based on the category dropdown
    const endpoint = category 
        ? `${API_URL}api/products?category=${category}` 
        : `${API_URL}api/products`;

    try {
        // 3. Ask the Node.js backend/MySQL for the filtered category data
        const response = await fetch(endpoint);
        
        // Handle 500 Server Error (required by rubric)
        if (!response.ok) throw new Error("Server down");
        
        let data = await response.json();

        // 4. We still do Search and Sort locally on the data the backend gave us
        data = data.filter(p => p.name.toLowerCase().includes(search));

        if (sort === 'price-asc') data.sort((a, b) => a.price - b.price);
        else if (sort === 'price-desc') data.sort((a, b) => b.price - a.price);
        else if (sort === 'name-asc') data.sort((a, b) => a.name.localeCompare(b.name));
        else if (sort === 'name-desc') data.sort((a, b) => b.name.localeCompare(a.name));

        // 5. Draw the final items to the screen
        renderUI(data);

    } catch (error) {
        console.error("Filtering failed:", error);
        alert("Could not filter products. The server might be down.");
    }
}

        const updateCartUI = () => {
            const list = document.getElementById('cartItemsList');
            const totalEl = document.getElementById('cartTotal');
            const countEl = document.getElementById('cartCount');
            list.innerHTML = '';
            let total = 0, count = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                count += item.qty;
                list.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent">
                        <div>
                            <h6 class="my-0">${item.name}</h6>
                            <div class="input-group input-group-sm mt-1" style="width: 90px;">
                                <button class="btn btn-outline-secondary cart-qty-btn" data-id="${item.id}" data-action="dec">-</button>
                                <input type="text" class="form-control text-center" value="${item.qty}" readonly>
                                <button class="btn btn-outline-secondary cart-qty-btn" data-id="${item.id}" data-action="inc">+</button>
                            </div>
                        </div>
                        <span class="text-dark">$${(item.price * item.qty).toFixed(2)}</span>
                    </li>`;
            });
            totalEl.innerText = `$${total.toFixed(2)}`;
            countEl.innerText = count;
            localStorage.setItem('protoCart', JSON.stringify(cart));
        };

        const handleAddToCart = (id) => {
            const product = allProducts.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if ((existing ? existing.qty : 0) >= product.stock) {
                alert(`Limit reached. Only ${product.stock} available.`);
                return;
            }
            if (existing) existing.qty++;
            else cart.push({ id, name: product.name, price: product.price, qty: 1 });
            updateCartUI();
        };

        document.getElementById('productGrid').addEventListener('click', e => {
            const id = e.target.dataset.id;
            if (e.target.classList.contains('add-to-cart-btn')) handleAddToCart(id);
            if (e.target.classList.contains('view-details-btn')) {
                const p = allProducts.find(x => x.id === id);
                document.getElementById('productDetailsBody').innerHTML = `
                    <div class="row g-4 mt-1">
                        <div class="col-md-6"><img src="${p.imageUrl}" class="img-fluid rounded border" alt="${p.name}"></div>
                        <div class="col-md-6 d-flex flex-column">
                            <h3 class="fw-bold text-dark">${p.name}</h3>
                            <div class="text-warning fs-5 mb-2">&#9733; <span class="text-muted small">${p.rating} / 5.0</span></div>
                            <h4 class="text-success fw-bold mb-3">$${p.price.toFixed(2)}</h4>
                            <p class="text-muted flex-grow-1">${p.description}</p>
                            <button class="btn btn-primary btn-lg w-100 modal-add-to-cart-btn" data-id="${p.id}">Add to Cart</button>
                        </div>
                    </div>`;
                bootstrap.Modal.getOrCreateInstance(document.getElementById('productDetailsModal')).show();
            }
        });

        document.getElementById('productDetailsBody').addEventListener('click', e => {
            if (e.target.classList.contains('modal-add-to-cart-btn')) {
                e.stopPropagation();
                handleAddToCart(e.target.dataset.id);
            }
        });

        document.getElementById('cartItemsList').addEventListener('click', e => {
            if (e.target.classList.contains('cart-qty-btn')) {
                const id = e.target.dataset.id;
                const action = e.target.dataset.action;
                const idx = cart.findIndex(i => i.id === id);
                if (action === 'inc') {
                    const stock = allProducts.find(p => p.id === id).stock;
                    if (cart[idx].qty < stock) cart[idx].qty++;
                    else alert("Out of stock.");
                } else {
                    if (cart[idx].qty > 1) cart[idx].qty--;
                    else cart.splice(idx, 1);
                }
                updateCartUI();
            }
        });

        const checkLoginState = () => {
            const btn = document.getElementById('authBtn');
            const loggedIn = localStorage.getItem('isLoggedIn') === 'true';
            btn.innerText = loggedIn ? 'My Profile' : 'Login / Register';
            btn.dataset.bsTarget = loggedIn ? '#profileOffcanvas' : '#authModal';
            btn.dataset.bsToggle = loggedIn ? 'offcanvas' : 'modal';
        };

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.setItem('isLoggedIn', 'false');
            localStorage.removeItem('userId'); // Clear session
            updateOrderHistoryUI([]); // Wipe the UI clean
            checkLoginState();
            bootstrap.Offcanvas.getInstance(document.getElementById('profileOffcanvas')).hide();
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('authUsername').value;
            const p = document.getElementById('authPassword').value;

            if (u === 'admin' && p === 'admin123') {
                window.location.href = 'admin.html';
                return;
            }

            try {
                const res = await fetch(`${API_URL}api/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                
                if (!res.ok) return alert('Incorrect password.');
                
                const data = await res.json();
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userId', data.userId); // Save DB ID
                
                checkLoginState();
                fetchOrders(); // Pull their specific orders
                bootstrap.Modal.getInstance(document.getElementById('authModal')).hide();
            } catch (err) {
                alert('Server connection failed.');
            }
        });

document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (cart.length === 0) return alert("Cart is empty.");
            
            const userId = localStorage.getItem('userId');
            if (!userId) {
                bootstrap.Modal.getInstance(document.getElementById('checkoutModal')).hide();
                return alert("You must be logged in to checkout!");
            }

            // Grab the credit card number from the input field
            const ccInput = document.querySelector('input[placeholder="16 Digits Required"]').value;
            
            // UI Feedback: Change button text to show processing
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalBtnText = submitBtn.innerText;
            submitBtn.innerText = "Processing Payment...";
            submitBtn.disabled = true;
            
            const ship = parseFloat(document.getElementById('shippingSelect').value);
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0) + ship;
            const step = Math.floor(Math.random() * 3) + 1;
            
            const newOrder = {
                userId: userId,
                date: new Date().toLocaleDateString(),
                total: total.toFixed(2),
                items: cart,
                statusStep: step,
                statusText: ["Placed", "Packed", "Shipped", "Delivered"][step],
                paymentDetails: { cardNumber: ccInput } // Send to server for validation
            };

            try {
                const response = await fetch(`${API_URL}api/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newOrder)
                });
                
                const data = await response.json();

                // Handle Mock Stripe Rejection
                if (!response.ok) {
                    alert(`Payment Error: ${data.error}`);
                    submitBtn.innerText = originalBtnText;
                    submitBtn.disabled = false;
                    return; // Stop execution, keep cart intact
                }
                
                // Success!
                fetchOrders();
                e.target.classList.add('d-none');
                document.getElementById('checkoutSuccess').classList.remove('d-none');
                cart = []; 
                updateCartUI();
                localStorage.removeItem('protoCart'); 
                
            } catch (err) {
                alert("Server connection failed during checkout.");
            } finally {
                // Always reset button state just in case
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            }
        });

// Fetch orders from backend
async function fetchOrders() {
            const userId = localStorage.getItem('userId');
            if (!userId) return; // Do not fetch if it's a guest

            try {
                const response = await fetch(`${API_URL}api/orders/${userId}`);
                const orders = await response.json();
                updateOrderHistoryUI(orders);
            } catch (err) {
                console.error("Failed to fetch orders:", err);
            }
        }

        const updateOrderHistoryUI = (orders) => {
            const list = document.getElementById('orderHistoryList');
            list.innerHTML = orders.length ? '' : '<p class="text-muted text-center mt-4">No orders yet.</p>';
            
            orders.forEach(o => {
                // Ensure items are parsed correctly from MySQL JSON
                const itemsArray = typeof o.items === 'string' ? JSON.parse(o.items) : o.items;
                
                const itemsHtml = (itemsArray || []).map(i => `<div class="d-flex justify-content-between small text-muted"><span>${i.qty}x ${i.name}</span><span>$${(i.price * i.qty).toFixed(2)}</span></div>`).join('');
                list.innerHTML += `
                    <div class="card mb-3 shadow-sm border-0 bg-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2"><strong class="text-dark">${o.date}</strong><span class="badge bg-primary">${o.statusText}</span></div>
                            ${itemsHtml}
                            <hr class="my-2">
                            <div class="d-flex justify-content-between fw-bold text-dark"><span>Total</span><span>$${o.total}</span></div>
                            <div class="mt-3"><div class="progress" style="height: 6px;"><div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: ${(o.statusStep/3)*100}%;"></div></div><div class="d-flex justify-content-between mt-1 text-muted" style="font-size: 0.6rem;"><span>Placed</span><span>Packed</span><span>Shipped</span><span>Delivered</span></div></div>
                        </div>
                    </div>`;
            });
        };

        ['searchInput', 'categorySelect', 'sortSelect'].forEach(id => document.getElementById(id).addEventListener('change', filterProducts));
        document.getElementById('searchInput').addEventListener('input', filterProducts);
        document.getElementById('clearCartBtn').addEventListener('click', () => { cart = []; updateCartUI(); });
        document.getElementById('checkoutModal').addEventListener('show.bs.modal', () => { const f = document.getElementById('checkoutForm'); f.classList.remove('d-none'); f.reset(); document.getElementById('checkoutSuccess').classList.add('d-none'); });

        updateCartUI(); checkLoginState(); fetchOrders(); requestProducts();
    </script>
</body>
</html>
